controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

leg_trajectory_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    open_loop_control: false
    interpolate_from_desired_state: true
    allow_integration_in_goal_trajectories: true
    allow_partial_joints_goal: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

    gains:
      FL_hip_joint:   {p: 450.0, i: 8.0,  d: 6.0, i_clamp: 20.0, ff_velocity_scale: 0.0}
      FL_thigh_joint: {p: 600.0, i: 25.0, d: 7.0, i_clamp: 45.0, ff_velocity_scale: 0.0}
      FL_calf_joint:  {p: 750.0, i: 25.0, d: 8.0, i_clamp: 55.0, ff_velocity_scale: 0.0}
      FR_hip_joint:   {p: 450.0, i: 8.0,  d: 6.0, i_clamp: 20.0, ff_velocity_scale: 0.0}
      FR_thigh_joint: {p: 600.0, i: 25.0, d: 7.0, i_clamp: 45.0, ff_velocity_scale: 0.0}
      FR_calf_joint:  {p: 750.0, i: 25.0, d: 8.0, i_clamp: 55.0, ff_velocity_scale: 0.0}
      RL_hip_joint:   {p: 450.0, i: 8.0,  d: 6.0, i_clamp: 20.0, ff_velocity_scale: 0.0}
      RL_thigh_joint: {p: 600.0, i: 25.0, d: 7.0, i_clamp: 45.0, ff_velocity_scale: 0.0}
      RL_calf_joint:  {p: 750.0, i: 25.0, d: 8.0, i_clamp: 55.0, ff_velocity_scale: 0.0}
      RR_hip_joint:   {p: 450.0, i: 8.0,  d: 6.0, i_clamp: 20.0, ff_velocity_scale: 0.0}
      RR_thigh_joint: {p: 600.0, i: 25.0, d: 7.0, i_clamp: 45.0, ff_velocity_scale: 0.0}
      RR_calf_joint:  {p: 750.0, i: 25.0, d: 8.0, i_clamp: 55.0, ff_velocity_scale: 0.0}

arm_trajectory_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      joint1: {trajectory: 0.35, goal: 0.10}
      joint2: {trajectory: 0.35, goal: 0.10}
      joint3: {trajectory: 0.35, goal: 0.10}
      joint4: {trajectory: 0.35, goal: 0.10}
      joint5: {trajectory: 0.35, goal: 0.10}
      joint6: {trajectory: 0.35, goal: 0.10}

gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - jointGripper

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    allow_partial_joints_goal: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      jointGripper: {trajectory: 1.5, goal: 1.0}

    gains:
      jointGripper: {p: 30.0, i: 6.0, d: 2.0, i_clamp: 8.0, ff_velocity_scale: 0.0}
