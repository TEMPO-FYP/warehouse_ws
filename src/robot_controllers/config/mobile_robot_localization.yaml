# AMCL parameters for the TEMPO mobile manipulator (mobile_robot_1, a200_0000).
#
# Based on clearpath_nav2_demos/config/a200/localization.yaml (jazzy), with the
# initial pose preset to the default spawn pose in warehouse_clearpath.launch.py.
# warehouse_sim/maps/warehouse_map.yaml is in Gazebo world coordinates, so the
# spawn pose in the world is also the robot's pose in the map, and no manual
# "2D Pose Estimate" is needed. mobile_robot_bringup.launch.py overrides the
# initial pose from its initial_x/initial_y/initial_yaw arguments.
amcl:
  ros__parameters:
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: -3.0
      z: 0.0
      yaw: 0.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # Update the filter often (Clearpath: 0.25 m / 0.2 rad): between updates
    # map->odom is frozen and odometry drift goes uncorrected, which leaves
    # the robot decimetres off where the arm needs it
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    # Overridden by mobile_robot_bringup.launch.py with the absolute topic
    scan_topic: sensors/lidar2d_0/scan

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True
