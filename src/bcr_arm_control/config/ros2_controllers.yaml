/**:
  controller_manager:
    ros__parameters:
      use_sim_time: true
      update_rate: 100

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      arm_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      gripper_controller:
        type: joint_trajectory_controller/JointTrajectoryController

  joint_state_broadcaster:
    ros__parameters:
      use_sim_time: true

  arm_trajectory_controller:
    ros__parameters:
      use_sim_time: true
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6
        - joint7

      command_interfaces:
        - position

      state_interfaces:
        - position
        - velocity

      allow_partial_joints_goal: false
      state_publish_rate: 50.0
      action_monitor_rate: 20.0

      constraints:
        stopped_velocity_tolerance: 0.02
        goal_time: 0.0
        joint1: {trajectory: 1.0, goal: 0.02}
        joint2: {trajectory: 1.0, goal: 0.02}
        joint3: {trajectory: 1.0, goal: 0.02}
        joint4: {trajectory: 1.0, goal: 0.02}
        joint5: {trajectory: 1.0, goal: 0.02}
        joint6: {trajectory: 1.0, goal: 0.02}
        joint7: {trajectory: 1.0, goal: 0.02}

  gripper_controller:
    ros__parameters:
      use_sim_time: true
      joints:
        - robotiq_85_left_knuckle_joint

      command_interfaces:
        - position

      state_interfaces:
        - position
        - velocity

      allow_partial_joints_goal: false
      state_publish_rate: 50.0
      action_monitor_rate: 20.0

      constraints:
        stopped_velocity_tolerance: 0.02
        goal_time: 0.0
        robotiq_85_left_knuckle_joint: {trajectory: 1.0, goal: 0.05}
