# Clearpath robot.yaml for the TEMPO mobile manipulator (mobile_robot_1):
# Husky A200 + UR5e + Robotiq 2F-85, with a 2D lidar for Nav2/AMCL.
# warehouse_clearpath.launch.py copies this to <setup_path>/robot.yaml, where
# Clearpath's generators build the robot description, controllers and launch files.
sensors:
  lidar2d:
    - model: hokuyo_ust
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [0.35, 0.0, 0.24]
      rpy: [0.0, 0.0, 0.0]
      # The Hokuyo UST's real 270 deg field of view. Without these limits the
      # simulated scan is 360 deg, and its rear beams hit the robot's own body
      # 0.2 m away, which Nav2's collision monitor treats as an obstacle inside
      # the footprint (the robot then never moves).
      ros_parameters:
        urg_node:
          laser_frame_id: lidar2d_0_laser
          ip_address: 192.168.131.20
          ip_port: 10940
          angle_min: -2.356
          angle_max: 2.356
serial_number: a200-0000
version: 0
system:
  hosts:
    - hostname: cpr-a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: a200_0000
platform:
  attachments:
    - name: front_bumper
      type: a200.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate
manipulators:
  arms:
    - model: universal_robots
      parent: top_plate_default_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ur_type: ur5e
      robot_ip: 192.168.131.40
      headless: false
      gripper:
        model: robotiq_2f_85
