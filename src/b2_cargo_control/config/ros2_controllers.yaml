/**:
  controller_manager:
    ros__parameters:
      use_sim_time: true
      update_rate: 250

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      leg_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

  joint_state_broadcaster:
    ros__parameters:
      use_sim_time: true

  leg_trajectory_controller:
    ros__parameters:
      use_sim_time: true
      joints:
        - FL_hip_joint
        - FL_thigh_joint
        - FL_calf_joint
        - FR_hip_joint
        - FR_thigh_joint
        - FR_calf_joint
        - RL_hip_joint
        - RL_thigh_joint
        - RL_calf_joint
        - RR_hip_joint
        - RR_thigh_joint
        - RR_calf_joint

      command_interfaces:
        - effort

      state_interfaces:
        - position
        - velocity

      open_loop_control: false
      interpolate_from_desired_state: true
      allow_integration_in_goal_trajectories: true
      allow_partial_joints_goal: false
      state_publish_rate: 50.0
      action_monitor_rate: 20.0

      constraints:
        stopped_velocity_tolerance: 0.01
        goal_time: 0.0

      gains:
        FL_hip_joint:   {p: 700.0, i: 15.0, d: 12.0, i_clamp: 35.0,  ff_velocity_scale: 0.0}
        FL_thigh_joint: {p: 900.0, i: 32.0, d: 18.0, i_clamp: 55.0,  ff_velocity_scale: 0.0}
        FL_calf_joint:  {p: 1150.0, i: 75.0, d: 12.5, i_clamp: 110.0, ff_velocity_scale: 0.0}
        FR_hip_joint:   {p: 700.0, i: 15.0, d: 12.0, i_clamp: 35.0,  ff_velocity_scale: 0.0}
        FR_thigh_joint: {p: 900.0, i: 32.0, d: 18.0, i_clamp: 55.0,  ff_velocity_scale: 0.0}
        FR_calf_joint:  {p: 1150.0, i: 75.0, d: 12.5, i_clamp: 110.0, ff_velocity_scale: 0.0}
        RL_hip_joint:   {p: 700.0, i: 15.0, d: 12.0, i_clamp: 35.0,  ff_velocity_scale: 0.0}
        RL_thigh_joint: {p: 900.0, i: 32.0, d: 18.0, i_clamp: 55.0,  ff_velocity_scale: 0.0}
        RL_calf_joint:  {p: 1150.0, i: 75.0, d: 12.5, i_clamp: 110.0, ff_velocity_scale: 0.0}
        RR_hip_joint:   {p: 700.0, i: 15.0, d: 12.0, i_clamp: 35.0,  ff_velocity_scale: 0.0}
        RR_thigh_joint: {p: 900.0, i: 32.0, d: 18.0, i_clamp: 55.0,  ff_velocity_scale: 0.0}
        RR_calf_joint:  {p: 1150.0, i: 75.0, d: 12.5, i_clamp: 110.0, ff_velocity_scale: 0.0}
